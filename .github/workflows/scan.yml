name: Auto Crypto Trend Scan
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Live Crypto Data
        run: |
          python3 - << 'EOF'
          import urllib.request, json, datetime

          coins = ["BTC", "ETH", "SOL", "XRP", "SUI"]

          def ema(p, n):
              k = 2 / (n + 1)
              e = p[0]
              for x in p[1:]:
                  e = x * k + e * (1 - k)
              return e

          def rsi(p):
              g, l, ag, al = 0, 0, 0, 0
              for i in range(1, len(p)):
                  d = p[i] - p[i-1]
                  gn = d if d > 0 else 0
                  ls = -d if d < 0 else 0
                  if i <= 14:
                      g += gn
                      l += ls
                      if i == 14:
                          ag, al = g / 14, l / 14
                  else:
                      ag = (ag * 13 + gn) / 14
                      al = (al * 13 + ls) / 14
              return 100 if al == 0 else 100 - (100 / (1 + ag / al))

          def get_tf(base, iv):
              y_iv = "15m" if iv == "15m" else "1h"
              y_rng = "60d" if iv == "4h" else ("15d" if iv == "1h" else "5d")
              url = f"https://yahoo.com{base}-USD?interval={y_iv}&range={y_rng}"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  j = json.loads(r.read().decode())
              raw_p = j["chart"]["result"][0]["indicators"]["quote"][0]["close"]
              p = [float(x) for x in raw_p if x is not None]
              if iv == "4h":
                  p = [p[i] for i in range(3, len(p), 4)]
              p = p[-210:]
              cp, e50, e200, rv = p[-1], ema(p, 50), ema(p, 200), rsi(p)
              st = "BUY" if (cp > e50 and e50 > e200) else ("SELL" if (cp < e50 and e50 < e200) else "SIDEWAYS")
              return st, cp, rv

          res = []
          for c in coins:
              try:
                  a, _, _ = get_tf(c, "4h")
                  b, _, _ = get_tf(c, "1h")
                  d, cp, rv = get_tf(c, "15m")
                  sig, code = "SIDEWAYS", "NONE"
                  if a == "BUY" and b == "BUY" and d == "BUY":
                      sig = "BUY (RSI High)" if rv > 65 else f"STRONG BUY @ ${cp}"
                      if rv <= 65: code = "BUY"
                  elif a == "SELL" and b == "SELL" and d == "SELL":
                      sig = "SELL (RSI Low)" if rv < 35 else f"STRONG SELL @ ${cp}"
                      if rv >= 35: code = "SELL"
                  res.append({"c": c+"USDT", "cp": cp, "t4": a, "t1": b, "t15": d, "rsi": f"{rv:.1f}", "sig": sig, "code": code})
              except Exception as e:
                  res.append({"c": c+"USDT", "cp": 0, "t4": "-", "t1": "-", "t15": "-", "rsi": "-", "sig": f"Err: {str(e)[:25]}", "code": "ERR"})

          ist = datetime.datetime.utcnow() + datetime.timedelta(hours=5, minutes=30)
          out = {"updated": ist.strftime("%I:%M:%S %p"), "results": res}
          with open("data.json", "w") as f:
              json.dump(out, f, indent=2)
          EOF
      - name: Save Data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git commit -m "Update prices" || exit 0
          git push
