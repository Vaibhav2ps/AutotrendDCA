<!DOCTYPE html>
<html>
<body style="background:#000;color:#0f0;font-family:sans-serif;padding:20px;">
  <h2 id="msg">🔴 Agar ye dikh raha hai toh JS band hai</h2>
  <button onclick="test()">Test Button</button>
  <script>
    document.getElementById("msg").innerText = "🟢 JS Chalu Hai!";

    }
  </script>
</body>
</html>
