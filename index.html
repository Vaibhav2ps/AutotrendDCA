<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Crypto Scanner + Alarm</title>
<style>
body{background:#0b0e11;color:#eaecef;font-family:sans-serif;padding:12px;margin:0}
.box{max-width:850px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h3{color:#f0b90b;margin:0;font-size:18px}
.panel{background:#181a20;border:1px solid #2b3139;border-radius:8px;padding:12px;margin-bottom:12px}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:8px}
button{padding:11px;background:#f0b90b;color:#000;font-weight:bold;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.off{background:#2b3139;color:#fff;border:1px solid #474d57}
.on{background:#0ecb81;color:#000}
.alert-box{background:#12161c;border:1px solid #2b3139;border-left:3px solid #f0b90b;border-radius:4px;padding:9px;margin-top:10px;font-size:12px;line-height:1.5}
.tbox{overflow-x:auto;background:#181a20;border:1px solid #2b3139;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:center}
th,td{padding:9px 6px;border-bottom:1px solid #2b3139;white-space:nowrap}
th{background:#1e2329;color:#848e9c;font-size:11px}
td:first-child,th:first-child{text-align:left;padding-left:10px}
.g{color:#0ecb81;font-weight:bold}.r{color:#f6465d;font-weight:bold}.y{color:#f0b90b}
.badge{padding:3px 6px;border-radius:3px;font-size:11px;font-weight:bold}
.bg-g{background:rgba(14,203,129,0.18);color:#0ecb81;border:1px solid #0ecb81}
.bg-r{background:rgba(246,70,93,0.18);color:#f6465d;border:1px solid #f6465d}
.bg-y{background:#2b3139;color:#f0b90b}
</style>
</head>
<body>
<div class="box">
<div class="top">
<h3>⚡ Cloud Crypto Scanner</h3>
<span id="st" style="font-size:12px;font-weight:bold">🟢 Ready</span>
</div>

<div class="panel">
<div class="btns">
<button type="button" onclick="loadCloudData(false)">🔄 Refresh Cloud Data</button>
<button type="button" id="mbtn" class="off" onclick="togMon()">🔔 Alarm: OFF</button>
</div>
<div style="display:flex;justify-content:space-between;font-size:11px;color:#848e9c;margin-top:8px">
<span id="mstat">Auto-Refresh OFF</span>
<a href="#" onclick="beep();alert('🔊 Sound Beep OK!');return false" style="color:#f0b90b">🔊 Test Beep</a>
</div>
<div class="alert-box" id="lastBox">📌 <b>Last Signal Alert:</b> Cloud scan data ka intezar hai...</div>
</div>

<div class="tbox">
<table>
<thead>
<tr>
<th>Coin</th>
<th>Live Price</th>
<th>4H</th>
<th>1H</th>
<th>15m</th>
<th>RSI</th>
<th>Final Status</th>
</tr>
</thead>
<tbody id="tb">
<tr><td colspan="7" style="text-align:center;color:#848e9c;padding:15px">Refresh button dabayein.</td></tr>
</tbody>
</table>
</div>
</div>

<script>
var timer=null,sec=60,alerted={};
function f(n){return n>=1000?n.toFixed(2):n>=1?n.toFixed(4):n.toFixed(6)}
function beep(){try{var A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator();o.frequency.value=920;o.connect(c.destination);o.start();o.stop(c.currentTime+0.4)}catch(e){}}
function cCls(v){return v=="BUY"?"g":v=="SELL"?"r":"y"}

function loadCloudData(auto){
fetch("./data.json?t="+Date.now())
.then(function(r){if(!r.ok)throw new Error("Actions tab se pehle scan run karein");return r.json()})
.then(function(data){
var html="",newAlerts=[];
data.results.forEach(function(r){
var pTxt=r.cp>0?"$"+f(r.cp):"-";
var bCls=r.code=="BUY"?"bg-g":r.code=="SELL"?"bg-r":"bg-y";
html+="<tr><td><b>"+r.c+"</b></td><td><b>"+pTxt+"</b></td><td class='"+cCls(r.t4)+"'>"+r.t4+"</td><td class='"+cCls(r.t1)+"'>"+r.t1+"</td><td class='"+cCls(r.t15)+"'>"+r.t15+"</td><td>"+r.rsi+"</td><td><span class='badge "+bCls+"'>"+r.sig+"</span></td></tr>";
if(r.code=="BUY"||r.code=="SELL"){
var key=r.c+"_"+r.code;
if(!alerted[key]){alerted[key]=true;newAlerts.push(r.c+" -> "+r.sig+" ("+data.updated+")")}
}else if(r.code=="NONE"){delete alerted[r.c+"_BUY"];delete alerted[r.c+"_SELL"]}
});
document.getElementById("tb").innerHTML=html;
document.getElementById("st").innerText="✅ Cloud Time: "+data.updated;
localStorage.setItem("cloud_tb",html);
if(newAlerts.length>0){
var msg="🚨 <b>Latest Signal ("+data.updated+"):</b> "+newAlerts.join(" | ");
document.getElementById("lastBox").innerHTML=msg;
localStorage.setItem("cloud_al",msg);
if(auto){
beep();
if("Notification"in window&&Notification.permission=="granted")new Notification("Crypto Signal!",{body:newAlerts.join("\n")});
else alert("🚨 SIGNAL:\n"+newAlerts.join("\n"));
}
}
})
.catch(function(e){document.getElementById("st").innerText="⚠️ "+e.message});
}

function startMon(){
var b=document.getElementById("mbtn"),ms=document.getElementById("mstat");
if(timer)clearInterval(timer);
b.innerText="🔔 Alarm: ON";b.className="on";localStorage.setItem("cloud_alarm","1");
loadCloudData(true);sec=60;
timer=setInterval(function(){sec--;if(sec<=0){sec=60;loadCloudData(true)}ms.innerText="🟢 Checking Cloud Data... Next in "+sec+"s"},1000);
}
function stopMon(){
var b=document.getElementById("mbtn"),ms=document.getElementById("mstat");
if(timer){clearInterval(timer);timer=null}
b.innerText="🔔 Alarm: OFF";b.className="off";ms.innerText="Auto-Refresh OFF";localStorage.setItem("cloud_alarm","0");
}
function togMon(){if(timer){stopMon()}else{if("Notification"in window)Notification.requestPermission();beep();startMon()}}

var svTb=localStorage.getItem("cloud_tb");if(svTb)document.getElementById("tb").innerHTML=svTb;
var svAl=localStorage.getItem("cloud_al");if(svAl)document.getElementById("lastBox").innerHTML=svAl;
if(localStorage.getItem("cloud_alarm")=="1"){startMon()}else{loadCloudData(false)}
</script>
</body>
</html>
